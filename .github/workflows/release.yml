name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            artifact: backend-dist-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: backend-dist-macos-x64
          - name: windows
            os: windows-latest
            artifact: backend-dist-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller woxus_backend.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/woxus-backend

  prepare-release:
    # Pre-create the tag + published release in the PUBLIC feed repo BEFORE
    # the 3 parallel electron-builder jobs run. Without this, all 3 jobs race
    # POST /repos/.../releases at the same second and the losers die with
    # 422 "Published releases must have a valid tag" (v0.1.16 arm64).
    # Idempotent: safe on reruns.
    runs-on: ubuntu-latest
    steps:
      - name: Pre-create woxus-releases tag + release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo Itsnishant4/woxus-releases >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping create"
            exit 0
          fi
          if ! gh api "repos/Itsnishant4/woxus-releases/git/refs/tags/$TAG" >/dev/null 2>&1; then
            SHA=$(gh api repos/Itsnishant4/woxus-releases/git/refs/heads/main -q .object.sha)
            gh api --method POST repos/Itsnishant4/woxus-releases/git/refs -f ref="refs/tags/$TAG" -f sha="$SHA" || true
          fi
          VER="${TAG#v}"
          gh release create "$TAG" --repo Itsnishant4/woxus-releases --title "$VER" --notes "Release $VER" || true

  release:
    needs: [build-backend, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            artifact: backend-dist-macos-arm64
            electron-args: --mac --arm64
            wacli-os: darwin
            wacli-arch: arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: backend-dist-macos-x64
            electron-args: --mac --x64
            wacli-os: darwin
            wacli-arch: x64
          - name: windows
            os: windows-latest
            artifact: backend-dist-windows
            electron-args: --win
            wacli-os: win32
            wacli-arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/woxus-backend
      - run: pnpm install --frozen-lockfile
      # Bundle the matching wacli binary (WhatsApp needs it on user systems).
      # Pinned via WACLI_VERSION (default v0.19.0, tested good).
      - run: node scripts/download-wacli.mjs --os ${{ matrix.wacli-os }} --arch ${{ matrix.wacli-arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run electron:release -- ${{ matrix.electron-args }}
        env:
          # Cross-repo PAT: GITHUB_TOKEN is scoped to woxus-agent only, but the
          # publish config targets the public woxus-releases repo (updater feed).
          # RELEASE_TOKEN must have write access to woxus-releases.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
