name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            artifact: backend-dist-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: backend-dist-macos-x64
          - name: windows
            os: windows-latest
            artifact: backend-dist-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller woxus_backend.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/woxus-backend

  release:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            artifact: backend-dist-macos-arm64
            electron-args: --mac --arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: backend-dist-macos-x64
            electron-args: --mac --x64
          - name: windows
            os: windows-latest
            artifact: backend-dist-windows
            electron-args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/woxus-backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm run electron:release -- ${{ matrix.electron-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
