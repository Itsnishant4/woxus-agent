name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---- macOS ARM64 ----
  build-backend-macos-arm64:
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runner: use the machine's Python (no actions/setup-python,
      # which can't write the /Users/runner tool cache).
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements.txt pyinstaller
      - run: python3 -m PyInstaller woxus_backend.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-macos-arm64
          path: backend/dist/woxus-backend

  release-macos-arm64:
    needs: build-backend-macos-arm64
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist-macos-arm64
          path: backend/dist/woxus-backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm run electron:release -- --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- macOS X64 ----
  build-backend-macos-x64:
    runs-on: [self-hosted, macOS, X64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements.txt pyinstaller
      - run: python3 -m PyInstaller woxus_backend.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-macos-x64
          path: backend/dist/woxus-backend

  release-macos-x64:
    needs: build-backend-macos-x64
    runs-on: [self-hosted, macOS, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist-macos-x64
          path: backend/dist/woxus-backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm run electron:release -- --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
