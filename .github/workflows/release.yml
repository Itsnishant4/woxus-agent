name: Release

on:
  push:
    tags:
      - "v*"

# Required so the GITHUB_TOKEN can create/upload to GitHub Releases.
# Without this, electron-builder gets 403 Forbidden on publish.
permissions:
  contents: write

jobs:
  build-backend:
    # One PyInstaller bundle per architecture. PyInstaller does not cross-compile,
    # and macOS cannot run the other arch's binary, so the macOS backend must be
    # built separately on an arm64 runner (macos-latest) and an Intel runner
    # (macos-15-intel). The Windows ia32 app ships the x64 backend: 32-bit
    # Windows is effectively extinct, and an ia32 Electron app runs the x64
    # backend as its own child process on 64-bit Windows.
    strategy:
      # Don't cancel the other platforms' builds if one fails.
      fail-fast: false
      matrix:
        include:
          # Current host is an Intel (x64) Mac. Add the arm64 MacBook + Windows
          # PC as self-hosted runners and uncomment those entries to build them.
          - name: macos-x64
            os: macos
            artifact: backend-dist-macos-x64
          # - name: macos-arm64
          #   os: macos
          #   artifact: backend-dist-macos-arm64
          # - name: windows
          #   os: windows
          #   artifact: backend-dist-windows
    # GitHub's default labels for a macOS x64 self-hosted runner — no custom labels needed.
    runs-on: [self-hosted, macOS, X64]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      # PyInstaller one-folder bundle → dist/woxus-backend/
      - run: python -m PyInstaller woxus_backend.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/woxus-backend

  release:
    needs: build-backend
    # 4 app variants, each matched to its own architecture's backend:
    #   macOS arm64 + macOS x64 (separate jobs, separate backends) and
    #   Windows x64 + Windows ia32 (one job; ia32 bundles the x64 backend).
    strategy:
      # Don't cancel the other platforms' releases if one fails.
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos
            artifact: backend-dist-macos-x64
            electron-args: --mac --x64
          # - name: macos-arm64
          #   os: macos
          #   artifact: backend-dist-macos-arm64
          #   electron-args: --mac --arm64
          # - name: windows
          #   os: windows
          #   artifact: backend-dist-windows
          #   electron-args: --win       # builds x64 + ia32 from electron-builder.yml
    # GitHub's default labels for a macOS x64 self-hosted runner — no custom labels needed.
    runs-on: [self-hosted, macOS, X64]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Must match electron-builder's extraResources `from: ../backend/dist/woxus-backend`
          # which resolves to repo-root backend/dist/woxus-backend (NOT frontend/backend/...).
          path: backend/dist/woxus-backend

      - run: pnpm install --frozen-lockfile

      # electron-builder publishes: writes latest.yml / latest-mac.yml +
      # blockmaps, uploads artifacts to GitHub Releases.
      # The --mac/--win + --arm64/--x64 flags select ONE architecture per job
      # (mac.target in electron-builder.yml no longer pins arch), so each job
      # bundles the architecture-matched backend it just downloaded.
      # electron:release = --publish always (GH_TOKEN from secrets).
      - run: pnpm run electron:release -- ${{ matrix.electron-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
