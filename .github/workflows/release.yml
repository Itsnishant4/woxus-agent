name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # electron-builder self-publishes: writes latest.yml / latest-mac.yml /
      # latest-linux.yml + blockmaps, uploads artifacts to GitHub Releases.
      - run: pnpm run electron:package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
