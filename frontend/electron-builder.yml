appId: com.woxus.app
productName: Woxus
publish:
  provider: github
  owner: Itsnishant4
  repo: woxus-agent
  token: ${env.GH_TOKEN}
directories:
  output: release
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/@nut-tree-fork/**/*.node
extraResources:
  - from: ../icons
    to: icons
    filter:
      - "**/*"
  - from: ../backend/dist/woxus-backend
    to: backend
    filter:
      - "**/*"
mac:
  icon: ../icons/macos/icon.icns
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Woxus uses the microphone to animate the orb when you speak.
win:
  icon: ../icons/windows/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
