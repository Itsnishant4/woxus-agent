appId: com.woxus.app
productName: Woxus
directories:
  output: release
files:
  - dist
  - dist-electron
extraResources:
  - from: ../icons
    to: icons
    filter:
      - "**/*"
mac:
  icon: ../icons/macos/icon.icns
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: ../icons/windows/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
