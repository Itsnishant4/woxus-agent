appId: com.woxus.app
productName: Woxus
publish:
  # Dedicated PUBLIC releases repo (woxus-agent stays private — the updater
  # reads this feed unauthenticated at runtime, so the source repo must not
  # be the update target). electron-builder uploads artifacts + latest.yml /
  # latest-mac.yml here; the GH_TOKEN below is the PAT used by CI to write.
  provider: github
  owner: Itsnishant4
  repo: woxus-releases
  # No explicit token: electron-builder's GitHub provider auto-reads
  # GH_TOKEN / GITHUB_TOKEN from the environment (set in CI). This lets
  # local `electron:package` (--publish never) build without a token.
directories:
  output: release
# GitHub Actions artifacts strip the exec bit from the bundled backend, so
# re-add it in the packed app (macOS spawn would otherwise fail with EACCES).
afterPack: scripts/after-pack.mjs
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/@nut-tree-fork/**/*.node
extraResources:
  - from: ../icons
    to: icons
    filter:
      - "**/*"
  - from: ../backend/dist/woxus-backend
    to: backend
    filter:
      - "**/*"
mac:
  icon: ../icons/macos/icon.icns
  # Ad-hoc code signing (free, no Apple Developer Program) — makes the app
  # launch without the "damaged" error. Users right-click → Open once.
  identity: "-"
  # Skip deep-signing the bundled PyInstaller backend. macOS codesign rejects
  # PyInstaller's Python.framework with "bundle format is ambiguous (could be
  # app or framework)". The backend is launched as a child process and needs
  # no signature; the outer .app remains ad-hoc signed.
  signIgnore:
    - "/Contents/Resources/backend/"
  hardenedRuntime: false
  entitlements: null
  entitlementsInherit: null
  # No "universal" fat-binary target: merging arm64+x64 fails because the
  # bundled PyInstaller backend ships arch-specific binaries (Python.framework)
  # that electron-builder can't merge. Each mac arch is built by a dedicated
  # CI job that passes --arm64 / --x64 and downloads an architecture-matched
  # backend — see .github/workflows/release.yml. Pinning arch here would make
  # electron-builder ignore the CLI arch flag and build both with one backend.
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Woxus uses the microphone to animate the orb when you speak.
win:
  icon: ../icons/windows/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  icon: ../icons/icon.png
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
