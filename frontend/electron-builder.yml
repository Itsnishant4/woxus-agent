appId: com.woxus.app
productName: Woxus
directories:
  output: release
files:
  - dist
  - dist-electron
mac:
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
