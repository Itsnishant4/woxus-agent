appId: com.woxus.app
productName: Woxus
publish:
  provider: github
  owner: Itsnishant4
  repo: woxus-agent
  # No explicit token: electron-builder's GitHub provider auto-reads
  # GH_TOKEN / GITHUB_TOKEN from the environment (set in CI). This lets
  # local `electron:package` (--publish never) build without a token.
directories:
  output: release
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/@nut-tree-fork/**/*.node
extraResources:
  - from: ../icons
    to: icons
    filter:
      - "**/*"
  - from: ../backend/dist/woxus-backend
    to: backend
    filter:
      - "**/*"
mac:
  icon: ../icons/macos/icon.icns
  # No code signing (no Apple Developer Program). The app is unsigned, so
  # macOS shows "Apple cannot verify" once — users right-click → Open. We
  # deliberately do NOT ad-hoc sign: signing the bundled PyInstaller
  # Python.framework crashes electron-builder with "bundle format is
  # ambiguous (could be app or framework)".
  target:
    - target: dmg
      arch:
        - arm64
        - x64
        - universal
    - target: zip
      arch:
        - arm64
        - x64
        - universal
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Universal (fat binary) needs to know which arch-specific .node files belong
  # to the x64 slice vs arm64 slice. Without this, electron-builder errors:
  # "same in both x64 and arm64 builds and not covered by the x64ArchFiles rule"
  x64ArchFiles: "node_modules/**/*.node"
  extendInfo:
    NSMicrophoneUsageDescription: Woxus uses the microphone to animate the orb when you speak.
win:
  icon: ../icons/windows/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  icon: ../icons/icon.png
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
